<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASE Studio – HeartOut</title>
<style>
  body{margin:0;background:#F7F1E6;color:#231F1C;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
       min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:420px}
  .icon{width:96px;height:96px;border-radius:22px;background:#1A1714;display:inline-flex;align-items:center;justify-content:center;font-size:48px;margin-bottom:18px}
  h1{margin:0 0 4px;font-size:30px}
  .studio{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#A89A82;margin-bottom:18px}
  p{line-height:1.6;color:#3D3530;margin:0 0 22px}
  a.btn{display:inline-block;background:#231F1C;color:#F7F1E6;text-decoration:none;padding:13px 26px;border-radius:14px;font-weight:600}
  .links{margin-top:22px;font-size:14px}
  .links a{color:#E84B6B;text-decoration:none;margin:0 8px}
</style>
</head>
<body>
  <div class="card">
    <div class="icon">💗</div>
    <h1>HeartOut</h1>
    <div class="studio">ASE Studio</div>
    <p>Kalpleri serbest bırak! Minimalist blok kaydırma bulmaca oyunu.<br>Set the hearts free! A minimalist block sliding puzzle game.</p>
    <a class="btn" href="https://play.google.com/store/apps/details?id=com.asestudio.heartout">Google Play</a>
    <div class="links">
      <a href="https://sites.google.com/view/heartout-privacy">Gizlilik Politikası / Privacy Policy</a>
    </div>
  </div>
</body>
</html>
